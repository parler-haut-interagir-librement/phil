# The Mermaid service beside the application, on a network without a way out: the service answers the application
# and reaches nothing else. Add the application's service to the `diagrams` network; never publish the port.
services:
    mermaid:
        build: .
        user: '1000:1000'
        read_only: true
        tmpfs:
            - /tmp:size=128m,mode=1777,nosuid,nodev
        cap_drop: [ALL]
        # Docker's default seccomp profile stays on: never `seccomp=unconfined`, which Chromium without its sandbox
        # does not need.
        security_opt: ['no-new-privileges:true']
        mem_limit: 768m
        memswap_limit: 768m
        cpus: 1.0
        pids_limit: 256
        ulimits:
            nofile: { soft: 1024, hard: 1024 }
        environment:
            CONCURRENCY: 2
            MAX_QUEUE: 16
            RENDER_TIMEOUT_MS: 8000
            MAX_BODY_BYTES: 65536
            MAX_CODE_LENGTH: 20000
            MAX_SVG_BYTES: 2097152
        networks: [diagrams]
        restart: unless-stopped

networks:
    diagrams:
        internal: true
