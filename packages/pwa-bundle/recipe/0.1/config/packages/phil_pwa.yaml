# The installable site: its manifest at /manifest.webmanifest, its service worker at /sw.js, its offline page at
# /offline. Name the site, add its icons under assets/, and put {{ phil_pwa_head() }} in the <head> of the layout and
# the controller phil--pwa-bundle--pwa on its <body>. See the configuration guide of phil/pwa-bundle.
phil_pwa:
    manifest:
        name: 'My site'
        short_name: 'Site'
        theme_color: '#1b1b1b'
        background_color: '#ffffff'
        # icons:
        #     - { src: images/icon-192.png, sizes: 192x192, type: image/png }
        #     - { src: images/icon-512.png, sizes: 512x512, type: image/png, purpose: [any, maskable] }
    service_worker:
        precache: ['/']
